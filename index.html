<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PerfLog — Pages légales</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #1a1d24;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --accent: #ff4d4d;
      --border: #2a2e36;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }
    .container {
      max-width: 640px;
      width: 100%;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 48px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card a {
      text-decoration: none;
      color: var(--text);
      display: block;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .card-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    footer {
      margin-top: 64px;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }
    .accent { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Perf<span class="accent">Log</span></h1>
    <p class="subtitle">Pages légales — Application de suivi musculation</p>

    <div class="card">
      <a href="/privacy-policy">
        <div class="card-title">Politique de confidentialité</div>
        <div class="card-desc">Comment vos données sont traitées (RGPD)</div>
      </a>
    </div>

    <div class="card">
      <a href="/terms">
        <div class="card-title">Conditions Générales d'Utilisation</div>
        <div class="card-desc">CGU régissant l'usage de l'application</div>
      </a>
    </div>

    <footer>
      © 2026 Vincent BERHOUET — <a href="mailto:contact@perflog.app" style="color: var(--text-muted);">contact@perflog.app</a>
    </footer>
  </div>
</body>
</html>
